name: WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

# Guards against this workflow overlapping itself. A group shared across all
# three README updaters was tried first and is wrong: GitHub keeps only one
# pending run per group, so dispatching all three together silently cancelled
# the middle one. They are kept apart by their crons instead (00:00, 06:00 and
# 08:00 UTC, against jobs that finish in under two minutes). Dispatch them one
# at a time when triggering manually, or the pushes can race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # No WakaTime account yet — this job will fail until WAKATIME_API_KEY is
      # set. Sign up at wakatime.com, install the editor plugin, then add the
      # secret. The section between the waka markers stays empty until then.
      - name: Write coding activity into README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: "True"
          SHOW_PROFILE: "False"
          SHOW_SHORT_INFO: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "False"
          SHOW_PROJECTS: "True"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "True"
          COMMIT_MESSAGE: "chore: update WakaTime stats [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
