name: GitHub Activity

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Guards against this workflow overlapping itself. A group shared across all
# three README updaters was tried first and is wrong: GitHub keeps only one
# pending run per group, so dispatching all three together silently cancelled
# the middle one. They are kept apart by their crons instead (00:00, 06:00 and
# 08:00 UTC, against jobs that finish in under two minutes). Dispatch them one
# at a time when triggering manually, or the pushes can race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write recent activity into README
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 5
          COMMIT_MSG: "chore: update GitHub activity [skip ci]"
